name: NICKL
description: >-
  NICKL (Nicklpass) is a subscription management platform that bills itself as
  "the operating system for subscriptions." It helps organizations govern the
  digital tools, SaaS subscriptions, and data services their teams use by
  connecting identity, usage, and procurement data in one place. Capabilities
  include role-based governance and provisioning, usage intelligence to surface
  adoption and redundant spend, and coordinated procurement that aggregates
  demand to negotiate from real usage data. The platform integrates with Google
  Workspace, Microsoft 365, and Plaid, and applies AI models for insights and
  pricing optimization. NICKL participated in the Comcast NBCUniversal LIFT Labs
  Accelerator powered by Techstars. As of this enrichment pass the company
  publishes a marketing site and hosted control panel but no public API,
  developer portal, OpenAPI, SDK, or other machine-readable API surface.
